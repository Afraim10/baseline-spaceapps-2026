<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BASELINE</title>
    <link rel="stylesheet" href="styles.css">
    <script src="data/claims.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="site-shell">
      <header>
        <p class="eyebrow">Astronaut health-monitoring prototype</p>
        <h1>BASELINE</h1>
        <p class="intro">An offline scaffold for personal-baseline health monitoring.</p>
      </header>

      <p class="prototype-banner" role="note">Prototype, simulated data, not medical advice</p>

      <section class="evidence" aria-labelledby="evidence-heading">
        <div class="section-heading">
          <h2 id="evidence-heading">Evidence</h2>
          <span class="status-label">SIMULATED</span>
        </div>
        <p id="claims-status">No verified claims available.</p>
        <ul id="claims-list" hidden></ul>
      </section>

      <footer>No medical assessment or live measurements are provided.</footer>
    </main>
  </body>
</html>
