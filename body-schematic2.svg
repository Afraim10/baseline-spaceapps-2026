<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 240 520"
     role="group"
     aria-labelledby="body-title body-desc" xmlns:c2pa="http://c2pa.org/manifest">

  <title id="body-title">BASELINE physiological body schematic</title>
  <desc id="body-desc">
    Front-facing human silhouette divided into three interactive zones:
    head and neuro, thorax and chest, and metabolic and systemic.
  </desc>

  <style>
    .silhouette {
      fill: var(--bg-surface-muted, #E8EEF2);
      stroke: var(--border-strong, #7C91A2);
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .zone {
      fill: var(--body-zone-fill, #D5DEE6);
      stroke: var(--border-strong, #7C91A2);
      stroke-width: 1.5;
      stroke-linejoin: round;
      stroke-linecap: round;
      cursor: pointer;
      outline: none;
      transition: fill 150ms ease, stroke 150ms ease;
    }

    .zone:hover {
      fill: rgba(21, 95, 122, 0.14);
    }

    .zone.is-active {
      fill: rgba(21, 95, 122, 0.28);
      stroke: var(--brand-primary, #155F7A);
      stroke-width: 2.5;
    }

    .zone:focus-visible {
      stroke: var(--focus-ring, #155F7A);
      stroke-width: 3;
    }

    /* Decorative anatomy hints: never intercept clicks */
    .detail {
      fill: none;
      stroke: var(--border-strong, #7C91A2);
      stroke-width: 1.25;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: 0.6;
      pointer-events: none;
      transition: stroke 150ms ease, opacity 150ms ease;
    }

    .detail-fill {
      fill: var(--border-strong, #7C91A2);
      stroke: none;
      opacity: 0.35;
    }

    .zone.is-active .detail,
    .zone:hover .detail {
      stroke: var(--brand-primary, #155F7A);
      opacity: 0.95;
    }

    .zone.is-active .detail-fill,
    .zone:hover .detail-fill {
      fill: var(--brand-primary, #155F7A);
      opacity: 0.5;
    }

    @media (prefers-reduced-motion: reduce) {
      .zone, .detail { transition: none; }
    }
  </style>

  <!-- ===== Neutral base: limbs, then full torso (opaque, hides limb overlap) ===== -->
  <g id="body-base" class="silhouette" aria-hidden="true">

    <!-- Right arm (viewer's right) -->
    <path d="
      M183 115
      C193 115 201 123 202 136
      C204 160 208 184 212 208
      C214 220 217 230 217 238
      C217 246 209 250 205 246
      C201 242 202 234 200 226
      C196 208 190 190 187 172
      C185 160 183 148 183 134
      C183 127 183 121 183 115 Z"/>

    <!-- Left arm -->
    <path d="
      M57 115
      C47 115 39 123 38 136
      C36 160 32 184 28 208
      C26 220 23 230 23 238
      C23 246 31 250 35 246
      C39 242 38 234 40 226
      C44 208 50 190 53 172
      C55 160 57 148 57 134
      C57 127 57 121 57 115 Z"/>

    <!-- Right leg -->
    <path d="
      M123 306
      L162 304
      C167 340 167 368 163 400
      C160 424 162 446 155 472
      L155 492
      C165 493 172 499 173 507
      L137 507
      L137 472
      C135 448 131 424 130 400
      C128 372 124 340 123 306 Z"/>

    <!-- Left leg -->
    <path d="
      M117 306
      L78 304
      C73 340 73 368 77 400
      C80 424 78 446 85 472
      L85 492
      C75 493 68 499 67 507
      L103 507
      L103 472
      C105 448 109 424 110 400
      C112 372 116 340 117 306 Z"/>

    <!-- Full torso (chest + abdomen/pelvis) -->
    <path d="
      M137 98
      C146 102 160 104 172 109
      C179 112 180 120 179 128
      C178 148 174 170 168 190
      C165 203 163 214 164 228
      C165 244 172 252 173 268
      C174 284 168 298 158 308
      C148 312 132 318 120 318
      C108 318 92 312 82 308
      C72 298 66 284 67 268
      C68 252 75 244 76 228
      C77 214 75 203 72 190
      C66 170 62 148 61 128
      C60 120 61 112 68 109
      C80 104 94 102 103 98 Z"/>
  </g>

  <!-- ===== Zone 1: Head / Neuro ===== -->
  <g id="zone-neuro"
     class="zone"
     role="button"
     tabindex="0"
     aria-pressed="false"
     aria-label="Head and neuro zone. Sleep hours and mood.">

    <path d="
      M120 16
      C139 16 151 30 151 50
      C151 64 146 74 139 80
      C137 83 136 87 136 92
      L137 98
      L103 98
      L104 92
      C104 87 103 83 101 80
      C94 74 89 64 89 50
      C89 30 101 16 120 16 Z"/>

    <!-- Brain hint: two hemispheres with folds -->
    <path class="detail" d="
      M119 30 C108 28 100 35 101 44 C96 49 98 58 106 60 C109 66 116 67 119 63 Z"/>
    <path class="detail" d="
      M121 30 C132 28 140 35 139 44 C144 49 142 58 134 60 C131 66 124 67 121 63 Z"/>
    <path class="detail" d="M105 44 C109 42 112 44 113 47 M135 44 C131 42 128 44 127 47"/>
  </g>

  <!-- ===== Zone 2: Thorax / Chest ===== -->
  <g id="zone-cardio"
     class="zone"
     role="button"
     tabindex="0"
     aria-pressed="false"
     aria-label="Thorax and chest zone. Blood pressure and heart rate.">

    <path d="
