      C146 102 160 104 172 109
      C179 112 180 120 179 128
      C178 148 174 170 168 190
      Q 120 174 72 190
      C66 170 62 148 61 128
      C60 120 61 112 68 109
      C80 104 94 102 103 98 Z"/>

    <!-- Lungs -->
    <path class="detail" d="
      M104 120 C94 118 82 126 80 146 C79 160 82 172 90 174 C98 175 104 170 104 160 Z"/>
    <path class="detail" d="
      M141 122 C148 118 158 126 160 146 C161 160 158 172 150 174 C144 175 143 170 143 160 Z"/>

    <!-- Heart -->
    <path class="detail" d="
      M124 168 C112 160 106 152 108 144 C110 137 119 136 124 143
      C129 136 138 137 140 144 C142 152 136 160 124 168 Z"/>
    <!-- Heart-rate trace -->
    <path class="detail" d="M112 152 H118 L121 146 L125 159 L128 150 H136"/>
  </g>

  <!-- ===== Zone 3: Metabolic / Systemic ===== -->
  <g id="zone-systemic"
     class="zone"
     role="button"
     tabindex="0"
     aria-pressed="false"
     aria-label="Metabolic and systemic zone. Blood glucose and body temperature.">

    <path d="
      M168 190
      C165 203 163 214 164 228
      C165 244 172 252 173 268
      C174 284 168 298 158 308
      C148 312 132 318 120 318
      C108 318 92 312 82 308
      C72 298 66 284 67 268
      C68 252 75 244 76 228
      C77 214 75 203 72 190
      Q 120 174 168 190 Z"/>

    <!-- Central vessel and iliac branches (systemic circulation) -->
    <path class="detail" d="
      M122 184 V258
      M122 258 C118 272 110 284 106 298
      M122 258 C126 272 134 284 138 298"/>

    <!-- Blood drop (glucose) -->
    <path class="detail" d="
      M100 212 C96 219 94 223 94 227 C94 231 97 234 100 234
      C103 234 106 231 106 227 C106 223 104 219 100 212 Z"/>

    <!-- Thermometer (body temperature) -->
    <rect class="detail" x="138" y="210" width="5" height="18" rx="2.5"/>
    <circle class="detail" cx="140.5" cy="233" r="5"/>
    <circle class="detail-fill" cx="140.5" cy="233" r="2.5"/>

    <!-- Pelvic brim -->
    <path class="detail" d="M84 272 C90 294 104 302 120 302 C136 302 150 294 156 272"/>
  </g>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
